name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and test server
        run: |
          dotnet restore ChatServer.Tests\ChatServer.Tests.csproj
          dotnet test ChatServer.Tests\ChatServer.Tests.csproj --no-restore --configuration Release

      - name: Restore and build WPF client
        run: |
          dotnet restore ChatClient\ChatClient.csproj
          dotnet build ChatClient\ChatClient.csproj --no-restore --configuration Release
